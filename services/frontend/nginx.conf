# ==============================================================================
# NexusEnterprise Hub - Frontend gateway (SPA static server + API/SSE reverse proxy)
#
# Installed as /etc/nginx/conf.d/default.conf, which the stock nginx.conf includes
# inside its `http { }` block, so http-context directives (log_format) are valid
# at the top level of this file, outside the server block.
# ==============================================================================

# Access log format that never records the query string: logs $uri only (never
# $request / $request_uri / $args) so `?token=<jwt>` on the SSE endpoint is not persisted.
log_format main_noquery '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" rt=$request_time';

server {
    listen 80;
    server_name localhost;

    server_tokens off;
    access_log /var/log/nginx/access.log main_noquery;

    root /usr/share/nginx/html;
    index index.html;

    # Allow document uploads up to 50MB through the API gateway
    client_max_body_size 50M;

    # Gzip compression for Angular production assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --- Security headers -----------------------------------------------------
    # NOTE: add_header in a location REPLACES (does not merge with) server-level
    # add_header directives, so every location that sets its own header repeats this block.
    # CSP: Angular is built with inlineCritical=false (no inline onload handler), so
    # script-src stays 'self'. 'unsafe-inline' styles are required for Angular component
    # styles and the build-time inlined Google Fonts @font-face CSS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # NGINX container healthcheck endpoint (also polled by the UI status indicator)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # SSE stream: GET /api/v1/tasks/{id}/stream?token=<jwt>
    # Dedicated location so the JWT-bearing query string is never written to logs:
    # access_log uses main_noquery; error_log is raised to `crit` because nginx error
    # entries include the full request line (with ?token=) on upstream failures.
    location ~ ^/api/v1/tasks/[^/]+/stream$ {
        error_log /var/log/nginx/error.log crit;

        proxy_pass http://core-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Edge proxy: overwrite (never append) client-supplied X-Forwarded-For so the
        # per-IP auth throttle in core-service cannot be bypassed with a spoofed header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # Backend sends `: keep-alive` comments every 15s; this only bounds dead streams
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE-optimized reverse proxy for the remaining Agent Task sub-resources
    # Regex prefix avoids NGINX's 301 trailing-slash redirect on POST/GET /api/v1/tasks
    location ~ ^/api/v1/tasks/ {
        proxy_pass http://core-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Reverse proxy all other REST API requests to Spring Boot core-service
    location /api/ {
        proxy_pass http://core-service:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # App shell: never cache, so new deployments are picked up immediately.
    # Also the target of the SPA fallback below (try_files -> /index.html).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Angular SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;

        # Content-hashed build assets (outputHashing=all): cache forever.
        # Nested so it never captures /api/* paths (those match /api/ first).
        location ~* \.(js|css|woff2?|png|svg|ico)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        }
    }
}
