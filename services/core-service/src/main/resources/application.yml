server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: core-service

  # NOTE: no hardcoded active profile; select one via SPRING_PROFILES_ACTIVE.

  # Multipart upload limits (default 1MB is too small for enterprise documents)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  # Relational Database Persistence (PostgreSQL 16)
  # Secrets have NO defaults: startup fails fast if they are not provided via environment.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexus_db}?currentSchema=core
    username: ${POSTGRES_USER:nexus_admin}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      pool-name: NexusHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    schemas: core
    default-schema: core
    locations: classpath:db/migration

  # Redis Distributed Cache & Token Blacklist
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

  # Kafka Event Streaming
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: nexus-core-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

# Management & Observability (Actuator + Resilience4j Health & Circuit Breakers)
management:
  # Actuator is served ONLY on this separate port (never on server.port 8080, which NGINX exposes).
  # The main SecurityFilterChain is applied to the management child context as well.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,retries,retryevents,metrics
  endpoint:
    health:
      # /actuator/health is public (docker healthcheck) but only exposes status;
      # component details are shown to authenticated PLATFORM_OPERATOR users only
      # (tenant ADMINs are org owners, not infrastructure operators).
      show-details: when-authorized
      show-components: when-authorized
      roles: PLATFORM_OPERATOR
  health:
    circuitbreakers:
      enabled: true

# Resilience4j Fault Tolerance Policies
resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.nexus.hub.common.exception.AiServiceUnavailableException
          - com.nexus.hub.common.exception.AiServiceTimeoutException
          - io.grpc.StatusRuntimeException
        ignoreExceptions:
          - com.nexus.hub.common.exception.BadRequestException
    instances:
      aiServiceGrpc:
        baseConfig: default
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    retryAspectOrder: 2
    instances:
      aiServiceRetry:
        maxAttempts: 2
        waitDuration: 500ms
        retryExceptions:
          - com.nexus.hub.common.exception.AiServiceUnavailableException

# Application-Specific Enterprise Tokens & Configurations
nexus:
  security:
    jwt:
      # HMAC-SHA256 signing key (>= 32 bytes). REQUIRED, no default.
      secret: ${JWT_SECRET}
      expiration-ms: 86400000 # 24 Hours
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:30}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    # Per-client-IP throttle for unauthenticated POST /api/v1/auth/login and /register
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_RPM:10}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
  ai-service:
    # Shared secret sent as gRPC metadata 'x-internal-api-key' on every call to ai-service.
    # REQUIRED, no default: startup fails if INTERNAL_API_KEY is unset or blank.
    internal-api-key: ${INTERNAL_API_KEY}
  rag:
    # Comma-separated allowlist of Qdrant collections a tenant may ingest into / search.
    allowed-collections: ${RAG_ALLOWED_COLLECTIONS:enterprise_docs}
  storage:
    shared-uploads-dir: ${SHARED_UPLOADS_DIR:/shared-uploads}
    upload-dir: ${SHARED_UPLOADS_DIR:/shared-uploads}
  kafka:
    topics:
      agent-task-requested: ${KAFKA_TOPIC_AGENT_TASK_REQUESTED:agent.task.requested}
      agent-task-events: ${KAFKA_TOPIC_AGENT_TASK_EVENTS:agent.task.events}
      agent-task-completed: ${KAFKA_TOPIC_AGENT_TASK_COMPLETED:agent.task.completed}
      agent-task-dlq: ${KAFKA_TOPIC_AGENT_TASK_DLQ:agent.task.dlq}
      # Async document ingestion (core-service -> ai-service, and the outcome back), key = documentId
      document-ingest-requested: ${KAFKA_TOPIC_DOCUMENT_INGEST_REQUESTED:document.ingest.requested}
      document-ingest-completed: ${KAFKA_TOPIC_DOCUMENT_INGEST_COMPLETED:document.ingest.completed}
    consumer-groups:
      document-ingest: ${KAFKA_GROUP_DOCUMENT_INGEST:nexus-core-document-ingest}
    producer:
      # Max time to wait (after DB commit) for the broker ack of agent.task.requested
      # and document.ingest.requested
      send-timeout-ms: ${KAFKA_TASK_SEND_TIMEOUT_MS:15000}
    dlq:
      backoff-initial-interval-ms: ${KAFKA_DLQ_BACKOFF_INITIAL_MS:1000}
      backoff-multiplier: ${KAFKA_DLQ_BACKOFF_MULTIPLIER:2.0}
      backoff-max-attempts: ${KAFKA_DLQ_BACKOFF_MAX_ATTEMPTS:3}
  grpc:
    ai-service:
      host: ${AI_SERVICE_GRPC_HOST:ai-service}
      port: ${AI_SERVICE_GRPC_PORT:50051}
      deadline-ms: ${AI_SERVICE_GRPC_DEADLINE_MS:15000}
      keep-alive-time-seconds: ${AI_SERVICE_GRPC_KEEP_ALIVE_SECONDS:30}

