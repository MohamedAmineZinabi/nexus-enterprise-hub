name: CI - AI Service (FastAPI, LangGraph, RAG & AI Evals)

on:
  push:
    branches: [main]
    paths:
      - 'services/ai-service/**'
      - 'proto/**'
      - '.github/workflows/ci-ai-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/ai-service/**'
      - 'proto/**'
      - '.github/workflows/ci-ai-service.yml'

jobs:
  lint-and-test:
    name: Lint (Ruff), Unit Tests & AI Evaluation/Red-Teaming Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ai-service/requirements.txt

      - name: Install Python dependencies & Ruff
        working-directory: services/ai-service
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r requirements.txt ruff

      - name: Lint AI Service with Ruff
        working-directory: services/ai-service
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Run AI Service unit, DLQ & MCP pytest suite
        working-directory: services/ai-service
        run: pytest tests/test_kafka_dlq.py tests/test_mcp_integration.py -v

      - name: Run AI Quality Assurance, Evaluation & Red-Teaming Suite (RAGAS, DeepEval, Giskard)
        working-directory: services/ai-service
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest tests/evals/ -v

      - name: Upload AI Evaluation & Red-Teaming Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-reports
          path: services/ai-service/tests/evals/reports/*.json
          if-no-files-found: warn
