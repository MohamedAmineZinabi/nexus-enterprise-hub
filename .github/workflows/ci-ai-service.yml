name: CI - AI Service (FastAPI, LangGraph, RAG & AI Evals)

on:
  push:
    branches: [main]
    paths:
      - 'services/ai-service/**'
      - 'proto/**'
      - '.github/workflows/ci-ai-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/ai-service/**'
      - 'proto/**'
      - '.github/workflows/ci-ai-service.yml'

permissions:
  contents: read

concurrency:
  group: ci-ai-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint (Ruff), Unit/Security Tests & AI Evaluation Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Test-only value; the real key is provided by the deployment environment
      INTERNAL_API_KEY: ci-internal-api-key-not-a-secret
      PYTHONPATH: ${{ github.workspace }}/services/ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv (with dependency cache)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            services/ai-service/requirements.txt
            services/ai-service/requirements-dev.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-msmarco-minilm-v1

      - name: Install dependencies (runtime + dev tooling)
        working-directory: services/ai-service
        run: |
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r requirements-dev.txt

      - name: Verify committed gRPC stubs match proto contracts
        run: |
          OUT=$(mktemp -d)
          python -m grpc_tools.protoc -I proto --python_out="$OUT" --grpc_python_out="$OUT" --pyi_out="$OUT" \
            proto/ai/common.proto proto/ai/v1/rag_service.proto proto/ai/v1/agent_service.proto
          for f in ai/common_pb2.py ai/v1/rag_service_pb2.py ai/v1/agent_service_pb2.py; do
            diff <(grep -o "AddSerializedFile(.*)" "$OUT/$f") \
                 <(grep -o "AddSerializedFile(.*)" "services/ai-service/app/grpc/generated/$f") \
              || { echo "::error::$f is out of date - run 'make proto'"; exit 1; }
          done

      - name: Lint AI Service with Ruff
        working-directory: services/ai-service
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Run unit, security, MCP & DLQ tests
        working-directory: services/ai-service
        run: python -m pytest tests -v --ignore=tests/test_multi_agent_kafka.py --ignore=tests/evals

      - name: Run AI Evaluation & Red-Teaming Suite (offline deterministic mode)
        working-directory: services/ai-service
        run: python -m pytest tests/evals/ -v

      - name: Upload AI Evaluation & Red-Teaming Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-reports
          path: services/ai-service/tests/evals/reports/*.json
          if-no-files-found: warn
