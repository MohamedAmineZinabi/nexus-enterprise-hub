services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Primary Relational Database)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_super_secret_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_admin} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (State, Rate Limiting & Distributed Locking)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-nexus_redis_secret_token_2026}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-nexus_redis_secret_token_2026} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # 3. Qdrant (Vector Database for Semantic Search & RAG)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: nexus-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__ENABLE_CORS: "true"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # 4. Apache Kafka (KRaft Mode - No Zookeeper)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: nexus-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: '${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - nexus-network

  # ----------------------------------------------------------------------------
  # 5. Kafka Provisioning Runner (Idempotent Topic Initializer)
  # ----------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: nexus-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./init-scripts/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
  # ----------------------------------------------------------------------------
  # 6. AI Microservice (FastAPI + gRPC + LangChain RAG)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ..
      dockerfile: services/ai-service/Dockerfile
    image: nexus-hub/ai-service:latest
    container_name: nexus-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexus_redis_secret_token_2026}@redis:6379
      SHARED_UPLOADS_DIR: /shared-uploads
      GRPC_PORT: 50051
    volumes:
      - shared_uploads:/shared-uploads
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus-network

# ------------------------------------------------------------------------------
# Persistent Storage & Shared Media Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: nexus_postgres_data
  redis_data:
    name: nexus_redis_data
  qdrant_data:
    name: nexus_qdrant_data
  kafka_data:
    name: nexus_kafka_data
  shared_uploads:
    name: nexus_shared_uploads

# ------------------------------------------------------------------------------
# Virtual Network
# ------------------------------------------------------------------------------
networks:
  nexus-network:
    name: nexus-network
    driver: bridge
